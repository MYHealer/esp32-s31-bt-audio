# Devices for this ESP32-S31 + ES8389 board.
# Logical names audio_dac / audio_adc must match the bt_audio example.

devices:
  - name: sdcard_power_ctrl
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_sd_power
        active_level: 0

  - name: audio_dac
    chip: es8389
    type: audio_codec
    config:
      adc_enabled: false
      dac_enabled: true
      sys_cfg:
        no_mclk: true
      dac_cfg:
        ref_enable: true
    peripherals:
      - pa_name: gpio_pa_control
        gain: 6
        active_level: 1
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x20
        frequency: 400000

  - name: audio_adc
    chip: es8389
    type: audio_codec
    config:
      adc_enabled: true
      dac_enabled: false
      sys_cfg:
        no_mclk: true
      dac_cfg:
        ref_enable: true
      adc_cfg:
        label: [FL, FR]
    peripherals:
      - i2s_name: i2s_audio_in
      - i2c_name: i2c_master
        address: 0x20
        frequency: 400000

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    # Skipped during auto-init: the SDMMC probe gives no upper bound on how long
    # it waits for a card response, so a missing or slow card parks app_main()
    # indefinitely and the task watchdog keeps rebooting the board. Neither the
    # UI nor the audio path needs /sdcard, so main.c mounts it separately and
    # tolerates failure.
    init_skip: true
    power_ctrl_device: sdcard_power_ctrl
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        slot_flags: SDMMC_SLOT_FLAG_INTERNAL_PULLUP
        pins:
          clk: 24
          cmd: 25
          d0: 20
          d1: 21
          d2: 22
          d3: 23
          cd: -1
          wp: -1

  - name: lcd_backlight_ctrl
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_lcd_bl
        active_level: 1

  # 800x480 ST7262 RGB666 wired as 24-line RGB888 (R0/R1,G0/G1,B0/B1 unused).
  # Pins match esp32s31-idf6_st7262-rgb565_sdmmc_mp4-player/main/app_lcd.h.
  - name: display_lcd
    chip: generic_rgb
    type: display_lcd
    version: 1.0.0
    sub_type: rgb
    power_ctrl_device: lcd_backlight_ctrl
    config:
      swap_xy: false
      mirror_y: false
      mirror_x: false
      invert_color: false
      need_reset: true
      bits_per_pixel: 24
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      rgb_panel_config:
        clk_src: LCD_CLK_SRC_DEFAULT
        data_width: 24
        in_color_format: LCD_COLOR_FMT_RGB888
        out_color_format: LCD_COLOR_FMT_RGB888
        num_fbs: 1
        bounce_buffer_size_px: 16000
        dma_burst_size: 128
        hsync_gpio_num: 44
        vsync_gpio_num: 45
        de_gpio_num: 43
        pclk_gpio_num: 40
        disp_gpio_num: -1
        data_gpio_nums:
          - -1  # B0 unused
          - -1  # B1 unused
          - 14  # B2
          - 15  # B3
          - 16  # B4
          - 17  # B5
          - 18  # B6
          - 19  # B7
          - -1  # G0 unused
          - -1  # G1 unused
          - 8   # G2
          - 9   # G3
          - 10  # G4
          - 11  # G5
          - 12  # G6
          - 13  # G7
          - -1  # R0 unused
          - -1  # R1 unused
          - 2   # R2
          - 3   # R3
          - 4   # R4
          - 5   # R5
          - 6   # R6
          - 7   # R7
        timings:
          pclk_hz: 18000000
          h_res: 800
          v_res: 480
          hsync_pulse_width: 1
          hsync_back_porch: 40
          hsync_front_porch: 20
          vsync_pulse_width: 1
          vsync_back_porch: 10
          vsync_front_porch: 5
          flags:
            pclk_active_neg: true
        flags:
          fb_in_psram: true

  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "*"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
        scl_speed_hz: 400000
      touch_config:
        x_max: 800
        y_max: 480
        rst_gpio_num: -1
        int_gpio_num: -1
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - i2c_name: i2c_master
        i2c_addr: [0xBA, 0x28]  # GT911 8-bit addresses (7-bit 0x5D / 0x14)
