dependencies:
  idf:
    version: ">=5.5.0"
  espressif/gmf_core:
    version: "~1.0"
  espressif/gmf_io:
    version: "~1.0"
  espressif/gmf_audio:
    version: "~1.0"
  espressif/gmf_misc:
    version: "~1.0"
  espressif/gmf_ai_audio:
    version: "~1.0"
  # espressif/esp_board_manager is deliberately NOT listed: it is vendored
  # locally at components/espressif__esp_board_manager so its Board Path can
  # point at this checkout's s31_es8389 board. It was earlier patched in place
  # under managed_components/, which broke the component-manager hash check and
  # aborted configure/fullclean with "Hash of the file CMakeLists.txt ... does
  # not match expected hash". Listing it here would pull the managed copy back
  # in and reintroduce that failure.
  # espressif/esp_bt_audio is deliberately NOT listed: it is vendored locally at
  # components/esp_bt_audio so the A2DP sink can register vendor-codec SEPs
  # (LDAC/aptX/LHDC/Opus/LC3plus) instead of the upstream SBC+AAC-only set.
  # Listing it here would pull the managed copy back in, whose hash check would
  # then shadow the local edits.
  espressif/esp_codec_dev:
    version: "*"
  espressif/esp_lvgl_port:
    version: "~2.9"
  lvgl/lvgl:
    version: "~9.5"
  espressif/esp_jpeg:
    version: "~1.3"
